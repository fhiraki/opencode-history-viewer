<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>OpenCode History Viewer</title>
<link rel="stylesheet" href="/style.css" />
<link rel="stylesheet" href="/dist/app.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">
      <svg viewBox="0 0 16 16" role="img" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
        <title>History</title>
        <circle cx="8" cy="8" r="6.2" />
        <path d="M8 4.6V8l2.4 1.6" />
      </svg>
    </span>
    <span>OpenCode History Viewer</span>
  </div>
  <div class="tabs" role="tablist">
    <span class="tabs-indicator" aria-hidden="true"></span>
    <button type="button" data-tab="sessions" id="tabBtn-sessions" role="tab" aria-selected="true" aria-controls="tab-sessions" class="active">Sessions</button>
    <button type="button" data-tab="search" id="tabBtn-search" role="tab" aria-selected="false" aria-controls="tab-search">Search</button>
    <button type="button" data-tab="timeline" id="tabBtn-timeline" role="tab" aria-selected="false" aria-controls="tab-timeline">Timeline</button>
    <button type="button" data-tab="stats" id="tabBtn-stats" role="tab" aria-selected="false" aria-controls="tab-stats">Stats</button>
  </div>
</header>

<main>
  <section id="tab-sessions" class="tab active" role="tabpanel" aria-labelledby="tabBtn-sessions">
    <div class="filters">
      <select id="projectFilter"><option value="">All projects</option></select>
      <select id="sortSelect">
        <option value="updated">Recently updated</option>
        <option value="created">Recently created</option>
      </select>
      <input id="sessionFilter" type="search" placeholder="Filter by title or directory" />
      <button type="button" id="reloadBtn" title="Reload projects and sessions from the database">Reload</button>
      <span id="sessionCount" class="muted"></span>
    </div>
    <div class="split">
      <div class="list-pane">
        <div id="sessionList" class="session-list"></div>
        <div class="pager">
          <button type="button" id="prevPage">← Prev</button>
          <span id="pageInfo" class="muted"></span>
          <button type="button" id="nextPage">Next →</button>
        </div>
      </div>
      <div class="detail-pane">
        <div id="sessionDetail" class="detail"><p class="muted">Select a session from the list.</p></div>
        <div class="msg-nav">
          <button type="button" id="navUp" aria-label="Previous exchange" disabled><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 8 6.5l4 4" /></svg></button>
          <span id="navPos" class="muted"></span>
          <button type="button" id="navDown" aria-label="Next exchange" disabled><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5 8 9.5l4-4" /></svg></button>
        </div>
      </div>
    </div>
  </section>

  <section id="tab-search" class="tab" role="tabpanel" aria-labelledby="tabBtn-search">
    <div class="filters">
      <input id="searchInput" type="search" placeholder="Search message bodies and tool output (space-separated AND)" />
      <button type="button" id="searchBtn">Search</button>
      <span id="searchCount" class="muted"></span>
    </div>
    <div id="searchResults" class="results"></div>
    <div class="pager">
      <button type="button" id="searchPrev">← Prev</button>
      <span id="searchPageInfo" class="muted"></span>
      <button type="button" id="searchNext">Next →</button>
    </div>
  </section>

  <section id="tab-timeline" class="tab" role="tabpanel" aria-labelledby="tabBtn-timeline">
    <div class="filters">
      <span class="muted">Daily activity: when and how much you worked. Click a row to filter sessions for that day.</span>
      <button type="button" id="timelineClear">Clear filter</button>
    </div>
    <div id="timeline" class="timeline"></div>
  </section>

  <section id="tab-stats" class="tab" role="tabpanel" aria-labelledby="tabBtn-stats">
    <div id="statsCards" class="cards"></div>
    <h3>By project</h3>
    <div id="statsProjects"></div>
    <h3>By model</h3>
    <div id="statsModels"></div>
    <h3>Top tools</h3>
    <div id="statsTools"></div>
  </section>
</main>

<footer class="foot">
  <span class="muted">Runs locally · DB opened read-only (the event table is never queried).</span>
</footer>

<script src="/dist/app.js" type="module"></script>
</body>
</html>
