name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # ubuntu-latest は 26.04 移行中 (actions/runner-images#14748) のため 24.04 にピン留め
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        # 24 は engines の下限、26 はローカル開発版。両方で検証する
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
